<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zefame - Social Media Booster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px 20px;
        }
        
        .service-group {
            margin-bottom: 25px;
        }
        
        .service-group h2 {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .service-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .service-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .service-btn:active {
            transform: translateY(0);
        }
        
        .service-info {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .service-btn:hover .service-info {
            color: rgba(255,255,255,0.8);
        }
        
        .cooldown-status {
            font-size: 11px;
            color: #dc3545;
            font-weight: 600;
            margin-top: 3px;
        }
        
        .service-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f8f9fa;
        }
        
        .service-btn:disabled:hover {
            background: #f8f9fa;
            transform: none;
            box-shadow: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 50px auto;
            position: relative;
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
        }
        
        .close:hover {
            color: #333;
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        
        .result.info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
        }
        
        .result h3 {
            margin-bottom: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .modal-content {
                padding: 20px;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Zefame</h1>
            <p>Social Media Booster</p>
        </div>
        
        <div class="content">
            <div class="service-group" style="background: linear-gradient(135deg, #ff0050 0%, #00f2ea 100%); padding: 20px; border-radius: 15px; margin-bottom: 30px; color: white;">
                <h2 style="color: white; margin-bottom: 15px;">⬇️ TikTok Video Downloader</h2>
                <p style="margin-bottom: 15px; opacity: 0.9;">Download TikTok videos without watermark</p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="tiktok-url" placeholder="Paste TikTok URL here..." style="flex: 1; min-width: 200px; padding: 12px; border: none; border-radius: 8px; font-size: 14px;">
                    <button id="tiktok-download-btn" type="button" style="padding: 12px 24px; background: white; color: #ff0050; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; -webkit-tap-highlight-color: transparent; touch-action: manipulation;">Download</button>
                </div>
                <div id="tiktok-result" style="margin-top: 15px; display: none; padding: 15px; background: rgba(255,255,255,0.2); border-radius: 8px;"></div>
            </div>
            
            <div class="service-group">
                <h2>📱 TikTok</h2>
                <button class="service-btn" id="btn-229" onclick="openModal('229', 'TikTok Views', 'Enter your TikTok video URL')">
                    <div>
                        <div>TikTok Views</div>
                        <div class="service-info">Cooldown: 5 Minutes</div>
                        <div class="cooldown-status" id="cooldown-229"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-232" onclick="openModal('232', 'TikTok Likes', 'Enter your TikTok video URL')">
                    <div>
                        <div>TikTok Likes</div>
                        <div class="service-info">Cooldown: 5 Minutes</div>
                        <div class="cooldown-status" id="cooldown-232"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-228" onclick="openModal('228', 'TikTok Followers', 'Enter your TikTok profile URL')">
                    <div>
                        <div>TikTok Followers</div>
                        <div class="service-info">Cooldown: 24 Hours</div>
                        <div class="cooldown-status" id="cooldown-228"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-235" onclick="openModal('235', 'TikTok Shares', 'Enter your TikTok video URL')">
                    <div>
                        <div>TikTok Shares</div>
                        <div class="service-info">Cooldown: 1 Hour</div>
                        <div class="cooldown-status" id="cooldown-235"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-236" onclick="openModal('236', 'TikTok Favorites', 'Enter your TikTok video URL')">
                    <div>
                        <div>TikTok Favorites</div>
                        <div class="service-info">Cooldown: 20 Minutes</div>
                        <div class="cooldown-status" id="cooldown-236"></div>
                    </div>
                </button>
            </div>
            
            <div class="service-group">
                <h2>📸 Instagram</h2>
                <button class="service-btn" id="btn-237" onclick="openModal('237', 'Instagram Views', 'Enter your Instagram post URL')">
                    <div>
                        <div>Instagram Views</div>
                        <div class="service-info">Cooldown: 5 Minutes</div>
                        <div class="cooldown-status" id="cooldown-237"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-234" onclick="openModal('234', 'Instagram Likes', 'Enter your Instagram post URL')">
                    <div>
                        <div>Instagram Likes</div>
                        <div class="service-info">Cooldown: 3 Hours</div>
                        <div class="cooldown-status" id="cooldown-234"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-233" onclick="openModal('233', 'Instagram Followers', 'Enter your Instagram profile URL')">
                    <div>
                        <div>Instagram Followers</div>
                        <div class="service-info">Cooldown: 24 Hours</div>
                        <div class="cooldown-status" id="cooldown-233"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-238" onclick="openModal('238', 'Instagram Story Views', 'Enter your Instagram profile URL')">
                    <div>
                        <div>Instagram Story Views</div>
                        <div class="service-info">Cooldown: 24 Hours</div>
                        <div class="cooldown-status" id="cooldown-238"></div>
                    </div>
                </button>
            </div>
            
            <div class="service-group">
                <h2>🐦 Twitter</h2>
                <button class="service-btn" id="btn-231" onclick="openModal('231', 'Twitter Views', 'Enter your Twitter post URL')">
                    <div>
                        <div>Twitter Views</div>
                        <div class="service-info">Cooldown: 20 Minutes</div>
                        <div class="cooldown-status" id="cooldown-231"></div>
                    </div>
                </button>
            </div>
            
            <div class="service-group">
                <h2>👥 Facebook</h2>
                <button class="service-btn" id="btn-242" onclick="openModal('242', 'Facebook Post Likes', 'Enter your Facebook post URL')">
                    <div>
                        <div>Facebook Post Likes</div>
                        <div class="service-info">Cooldown: 3 Hours</div>
                        <div class="cooldown-status" id="cooldown-242"></div>
                    </div>
                </button>
                <button class="service-btn" id="btn-244" onclick="openModal('244', 'Facebook Followers', 'Enter your Facebook profile URL')">
                    <div>
                        <div>Facebook Followers</div>
                        <div class="service-info">Cooldown: 12 Hours</div>
                        <div class="cooldown-status" id="cooldown-244"></div>
                    </div>
                </button>
            </div>
            
            <div class="service-group">
                <h2>📺 YouTube</h2>
                <button class="service-btn" id="btn-246" onclick="openModal('246', 'YouTube Likes', 'Enter your YouTube video URL')">
                    <div>
                        <div>YouTube Likes</div>

                        <div class="cooldown-status" id="cooldown-246"></div>
                    </div>

            </div>
            
            <div class="service-group">
                <h2>✈️ Telegram</h2>
                <button class="service-btn" id="btn-248" onclick="openModal('248', 'Telegram Views', 'Enter your Telegram post URL')">
                    <div>
                        <div>Telegram Views</div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Place Order</h2>
            <form id="order-form" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label id="url-label" for="url">URL</label>
                    <input type="url" id="url" required placeholder="https://...">
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">Submit Order</button>
            </form>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your order...</p>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>
    
    <script>
        let currentServiceId = null;
        
        // TikTok Downloader
        async function downloadTikTok() {
            console.log('downloadTikTok called'); // Debug
            const urlInput = document.getElementById('tiktok-url');
            const resultDiv = document.getElementById('tiktok-result');
            
            if (!urlInput || !resultDiv) {
                alert('Error: Page elements not found. Please refresh the page.');
                return;
            }
            
            const url = urlInput.value.trim();
            
            // Always show result div
            resultDiv.style.display = 'block';
            resultDiv.style.visibility = 'visible';
            
            if (!url) {
                resultDiv.innerHTML = '<p style="color: #ffeb3b; margin: 0;">⚠️ Please enter a TikTok URL</p>';
                return;
            }
            
            if (!url.includes('tiktok.com') && !url.includes('vm.tiktok.com') && !url.includes('vt.tiktok.com')) {
                resultDiv.innerHTML = '<p style="color: #ffeb3b; margin: 0;">⚠️ Please enter a valid TikTok URL</p>';
                return;
            }
            
            resultDiv.innerHTML = '<p style="margin: 0; color: white;">⏳ Processing... Please wait</p>';
            
            try {
                console.log('Sending request for URL:', url); // Debug
                const response = await fetch('/api/tiktok-download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });
                
                console.log('Response status:', response.status); // Debug
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data); // Debug
                
                if (data.status === 'success' && data.video_url) {
                    resultDiv.innerHTML = `
                        <div style="color: white;">
                            <p style="font-weight: 600; margin-bottom: 10px; margin-top: 0;">✓ Video Ready!</p>
                            ${data.title ? `<p style="margin-bottom: 5px; font-size: 14px;"><strong>Title:</strong> ${data.title}</p>` : ''}
                            ${data.author ? `<p style="margin-bottom: 10px; font-size: 14px;"><strong>Author:</strong> ${data.author}</p>` : ''}
                            <a href="${data.video_url}" download="tiktok-video.mp4" style="display: inline-block; padding: 12px 24px; background: white; color: #ff0050; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 10px; width: 100%; text-align: center; box-sizing: border-box;">⬇️ Download Video</a>
                            <a href="${data.video_url}" target="_blank" style="display: inline-block; padding: 12px 24px; background: rgba(255,255,255,0.3); color: white; border-radius: 8px; text-decoration: none; margin-top: 10px; width: 100%; text-align: center; box-sizing: border-box;">🔗 Open in New Tab</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div style="color: #ffeb3b;">
                            <p style="font-weight: 600; margin: 0 0 10px 0;">✗ ${data.message || 'Failed to download video'}</p>
                            <p style="margin-top: 10px; font-size: 12px; margin-bottom: 0;">Try using: <a href="https://ssstik.io" target="_blank" style="color: white; text-decoration: underline;">ssstik.io</a> or <a href="https://snapany.com/tiktok" target="_blank" style="color: white; text-decoration: underline;">snapany.com</a></p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Download error:', error); // Debug
                resultDiv.innerHTML = `
                    <div style="color: #ffeb3b;">
                        <p style="font-weight: 600; margin: 0 0 10px 0;">✗ Error: ${error.message}</p>
                        <p style="margin-top: 10px; font-size: 12px; margin-bottom: 0;">Try using: <a href="https://ssstik.io" target="_blank" style="color: white; text-decoration: underline;">ssstik.io</a> or <a href="https://snapany.com/tiktok" target="_blank" style="color: white; text-decoration: underline;">snapany.com</a></p>
                    </div>
                `;
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, setting up TikTok downloader'); // Debug
            
            const tiktokInput = document.getElementById('tiktok-url');
            const downloadBtn = document.getElementById('tiktok-download-btn');
            
            if (!downloadBtn) {
                console.error('Download button not found!');
                return;
            }
            
            // Add Enter key support
            if (tiktokInput) {
                tiktokInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        downloadTikTok();
                    }
                });
            }
            
            // Ensure button works on mobile and desktop
            function handleDownload() {
                console.log('Download triggered!'); // Debug
                downloadTikTok();
            }
            
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                handleDownload();
            });
            
            // Also add touch event for mobile (use touchstart for better responsiveness)
            downloadBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                handleDownload();
            }, { passive: false });
            
            // Fallback: direct onclick (for older browsers)
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                handleDownload();
            };
        });
        
        // Cooldown management
        const defaultCooldowns = {
            '229': 5,   // TikTok Views - 5 minutes
            '232': 5,   // TikTok Likes - 5 minutes
            '228': 1440, // TikTok Followers - 24 hours
            '235': 60,  // TikTok Shares - 1 hour
            '236': 20,  // TikTok Favorites - 20 minutes
            '237': 5,   // Instagram Views - 5 minutes
            '234': 180, // Instagram Likes - 3 hours
            '233': 1440, // Instagram Followers - 24 hours
            '238': 1440, // Instagram Story Views - 24 hours
            '231': 20,  // Twitter Views - 20 minutes
            '242': 180, // Facebook Post Likes - 3 hours
            '244': 720, // Facebook Followers - 12 hours
            '246': 180, // YouTube Likes - 3 hours
            '248': 30   // Telegram Views - 30 minutes
        };
        
        function parseCooldownTime(cooldownText) {
            if (!cooldownText) return null;
            
            const text = cooldownText.toLowerCase();
            let minutes = 0;
            
            // Try to extract time from text
            const hourMatch = text.match(/(\d+)\s*hour/);
            const minuteMatch = text.match(/(\d+)\s*minute/);
            const dayMatch = text.match(/(\d+)\s*day/);
            
            if (dayMatch) minutes += parseInt(dayMatch[1]) * 1440;
            if (hourMatch) minutes += parseInt(hourMatch[1]) * 60;
            if (minuteMatch) minutes += parseInt(minuteMatch[1]);
            
            // If we found a number but no unit, assume minutes
            if (minutes === 0) {
                const numMatch = text.match(/(\d+)/);
                if (numMatch) minutes = parseInt(numMatch[1]);
            }
            
            return minutes > 0 ? minutes : null;
        }
        
        function setCooldown(serviceId, cooldownMinutes) {
            if (!cooldownMinutes) {
                // Use default cooldown if API didn't provide one
                cooldownMinutes = defaultCooldowns[serviceId] || 5;
            }
            
            const expiresAt = Date.now() + (cooldownMinutes * 60 * 1000);
            localStorage.setItem(`cooldown_${serviceId}`, expiresAt.toString());
            updateCooldownDisplay(serviceId);
        }
        
        function getCooldownRemaining(serviceId) {
            const expiresAt = localStorage.getItem(`cooldown_${serviceId}`);
            if (!expiresAt) return null;
            
            const remaining = parseInt(expiresAt) - Date.now();
            return remaining > 0 ? remaining : null;
        }
        
        function formatTimeRemaining(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }
        
        function updateCooldownDisplay(serviceId) {
            const cooldownEl = document.getElementById(`cooldown-${serviceId}`);
            const btnEl = document.getElementById(`btn-${serviceId}`);
            
            if (!cooldownEl || !btnEl) return;
            
            const remaining = getCooldownRemaining(serviceId);
            
            if (remaining) {
                cooldownEl.textContent = `⏱ Available in: ${formatTimeRemaining(remaining)}`;
                cooldownEl.style.display = 'block';
                btnEl.disabled = true;
            } else {
                cooldownEl.textContent = '';
                cooldownEl.style.display = 'none';
                btnEl.disabled = false;
                localStorage.removeItem(`cooldown_${serviceId}`);
            }
        }
        
        function updateAllCooldowns() {
            Object.keys(defaultCooldowns).forEach(serviceId => {
                updateCooldownDisplay(serviceId);
            });
        }
        
        // Update cooldowns every second
        setInterval(updateAllCooldowns, 1000);
        
        // Initial update
        updateAllCooldowns();
        
        function openModal(serviceId, title, label) {
            // Check if service is on cooldown
            const remaining = getCooldownRemaining(serviceId);
            if (remaining) {
                alert(`This service is on cooldown. Available in: ${formatTimeRemaining(remaining)}`);
                return;
            }
            
            currentServiceId = serviceId;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('url-label').textContent = label;
            document.getElementById('url').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('result').className = 'result';
            document.getElementById('modal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submit-btn').disabled = false;
        }
        
        async function submitOrder(event) {
            event.preventDefault();
            const url = document.getElementById('url').value;
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        service_id: currentServiceId,
                        url: url
                    })
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                // Parse and set cooldown if provided
                if (data.cooldown && currentServiceId) {
                    const cooldownMinutes = parseCooldownTime(data.cooldown);
                    if (cooldownMinutes) {
                        setCooldown(currentServiceId, cooldownMinutes);
                    }
                } else if (data.status === 'success' && currentServiceId) {
                    // Set default cooldown on success if API didn't provide one
                    const defaultCooldown = defaultCooldowns[currentServiceId];
                    if (defaultCooldown) {
                        setCooldown(currentServiceId, defaultCooldown);
                    }
                }
                
                if (data.status === 'success') {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✓ Success!</h3>
                        <p>${data.message || 'Order placed successfully!'}</p>
                        ${data.cooldown ? `<p><strong>⏱ Cooldown:</strong> ${data.cooldown}</p>` : ''}
                    `;
                } else if (data.status === 'cooldown') {
                    result.className = 'result info';
                    result.innerHTML = `
                        <h3>⏱ Cooldown Active</h3>
                        <p>${data.message || 'Please wait before placing another order'}</p>
                        ${data.cooldown ? `<p><strong>Wait time:</strong> ${data.cooldown}</p>` : ''}
                    `;
                    // Set cooldown from API response
                    if (data.cooldown && currentServiceId) {
                        const cooldownMinutes = parseCooldownTime(data.cooldown);
                        if (cooldownMinutes) {
                            setCooldown(currentServiceId, cooldownMinutes);
                        }
                    }
                } else if (data.status === 'error' || data.status === 'failed') {
                    result.className = 'result error';
                    result.innerHTML = `
                        <h3>✗ Error</h3>
                        <p>${data.message}</p>
                        ${data.cooldown ? `<p><strong>⏱ Cooldown:</strong> ${data.cooldown}</p>` : ''}
                    `;
                } else {
                    result.className = 'result info';
                    result.innerHTML = `
                        <h3>Response</h3>
                        <p>${data.message || 'Request completed'}</p>
                        ${data.cooldown ? `<p><strong>⏱ Cooldown:</strong> ${data.cooldown}</p>` : ''}
                    `;
                }
                
                submitBtn.disabled = false;
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <h3>✗ Error</h3>
                    <p>${error.message}</p>
                `;
                submitBtn.disabled = false;
            }
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
